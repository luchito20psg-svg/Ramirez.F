<div class="container mt-5 mb-5">

  <div class="text-center mb-4">

    <h1 class="titulo">Nosotros</h1>

    <p class="lead">
      En Mi Mascota cuidamos a tus mejores amigos.
      Ofrecemos atención profesional, cariño y
      compromiso con el bienestar de tus mascotas.
    </p>

  </div>

  <!-- Carrusel de imágenes -->

  <div id="carruselMascotas"
       class="carousel slide"
       data-bs-ride="carousel">

    <!-- Indicadores -->

    <div class="carousel-indicators">

      <button type="button"
              data-bs-target="#carruselMascotas"
              data-bs-slide-to="0"
              class="active">
      </button>

      <button type="button"
              data-bs-target="#carruselMascotas"
              data-bs-slide-to="1">
      </button>

      <button type="button"
              data-bs-target="#carruselMascotas"
              data-bs-slide-to="2">
      </button>

    </div>

    <!-- Imágenes -->

    <div class="carousel-inner">

      <div class="carousel-item active">

        <img
          src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=1200"
          class="d-block w-100 imagen-carrusel"
          alt="Perro mascota">

        <div class="carousel-caption">
          <h5>Amor por nuestras mascotas</h5>
        </div>

      </div>

      <div class="carousel-item">

        <img
          src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=1200"
          class="d-block w-100 imagen-carrusel"
          alt="Gato mascota">

        <div class="carousel-caption">
          <h5>Cuidado y protección</h5>
        </div>

      </div>

      <div class="carousel-item">

        <img
          src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=1200"
          class="d-block w-100 imagen-carrusel"
          alt="Perro golden">

        <div class="carousel-caption">
          <h5>Su bienestar es nuestra prioridad</h5>
        </div>

      </div>

    </div>

    

    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#carruselMascotas"
            data-bs-slide="prev">

      <span class="carousel-control-prev-icon"></span>

    </button>

  

    <button class="carousel-control-next"
            type="button"
            data-bs-target="#carruselMascotas"
            data-bs-slide="next">

      <span class="carousel-control-next-icon"></span>

    </button>

  </div>

</div>
